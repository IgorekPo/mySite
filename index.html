<!DOCTYPE html>
<html lang="ua">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>IgorekPo</title>
      <link rel="stylesheet" href="./css/style.css">
   </head>
   <body>
      <div id="loader">
         <img src="./img/logo.png" alt="Logo" class="zoom-logo">
      </div>
      <div id="content" style="display: none;">
      </div>
      <div class="wrapper">
         <header class="header">
            <div class="header__container">
               <a href="#" class="header__logo">
                  <img src="./img/logo.png" alt="Логотип">
               </a>
               <nav class="header__nav">
                  <ul class="header__links">
                     <li class="header__link"><a href="#about">Про мене</a></li>
                     <li class="header__link"><a href="#sites">Сайти</a></li>
                     <li class="header__link"><a
                           href="#experience">Досвід</a></li>
                  </ul>
               </nav>
            </div>
         </header>
         <main>
            <section class="herro">
               <div class="parallax-bg" data-speed="2"></div>
               <div class="herro__container">
                  <div class="herro__informations">
                     <p class="herro__name">Ігор Поляков - Web Developer</p>
                     <h1 class="herro__title">Архітектура коду та естетика
                        інтерфейсу</h1>
                     <p class="herro__text">Спеціалізуюся на створенні швидких,
                        адаптивних та інтуїтивно зрозумілих сайтів. Мій стек –
                        ваш успіх у мережі.</p>
                  </div>
                  <div class="parallax-scene">
                     <img src="./img/notebook.png" alt="Laptop"
                        class="parallax-layer layer-laptop" data-speed="4">
                     <img src="./img/gear.png" alt="Gear"
                        class="parallax-layer layer-gear" data-speed="8">
                     <img src="./img/icon.webp" alt="S Icon"
                        class="parallax-layer layer-s-icon" data-speed="14">
                     <img src="./img/cursor.png" alt="Cursor"
                        class="parallax-layer layer-cursor" data-speed="12">
                  </div>
               </div>
            </section>
            <section class="sites"></section>
            <section class="experience"></section>
         </main>
         <footer class="footer"></footer>
      </div>
      <script src="script.js"></script>
   </body>
</html>
