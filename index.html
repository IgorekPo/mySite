<!DOCTYPE html>
<html lang="ua">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>IgorekPo</title>
      <link rel="stylesheet" href="./css/style.css">
   </head>
   <body>
      <div id="loader">
         <img src="./img/logo.png" alt="Logo" class="zoom-logo">
      </div>
      <div id="content" style="display: none;">
      </div>
      <div class="wrapper">
         <header class="header">
            <div class="header__container">
               <a href="#" class="header__logo">
                  <img src="./img/logo.png" alt="Логотип">
               </a>
               <a type="tel" href="tel:+380931614471" class="header__phone">+38
                  (093) 161-44-71</a>
               <nav class="header__nav">
                  <ul class="header__links">
                     <li class="header__link"><a href="#about">Головна</a></li>
                     <li class="header__link"><a href="#about">Про мене</a></li>
                     <li class="header__link"><a href="#sites">Роботи</a></li>
                     <li class="header__link"><a
                           href="#experience">Досвід</a></li>
                     <li class="header__link"><a
                           href="#contacts">Контакти</a></li>

                  </ul>
               </nav>
               <div class="header__burger">
                  <span></span>
               </div>
            </div>
         </header>
         <main class="main">
            <section class="herro">
               <div class="herro-wrapper" id="herro-scene">
                  <div class="herro-layer layer-bg"
                     data-speed="0.1"></div>
                  <div class="herro-layer layer-code"
                     data-speed="0.55"></div>
                  <div class="herro-layer layer-dust"
                     data-speed="0.15"></div>
               </div>
               <div class="herro__container">
                  <div class="herro__informations">
                     <p class="herro__name">Ігор Поляков - Web Developer</p>
                     <h1 class="herro__title">Архітектура коду та естетика
                        інтерфейсу</h1>
                     <p class="herro__text">Спеціалізуюся на створенні швидких,
                        адаптивних та інтуїтивно зрозумілих сайтів. Мій стек –
                        ваш успіх у мережі.</p>
                  </div>

                  <!-- Кнопка для iOS (появляется только если нужно разрешение) -->
                  <button id="activate-gyro" class="gyro-btn">Активувати 3D
                     ефект</button>
               </div>
            </section>
            <section class="about">
               <div class="parallax-bg parallax-bg--about" data-speed="2"></div>
               <div class="about__container">
               </div>
            </section>
            <section class="works">
               <div class="parallax-bg parallax-bg--works" data-speed="2"></div>
               <div class="works__container">
               </div>
            </section>
            <section class="experience">
               <div class="parallax-bg parallax-bg--experience"
                  data-speed="2"></div>
               <div class="experience__container">
               </div>
            </section>
         </main>
         <footer class="footer"></footer>
      </div>
      <script src="script.js"></script>
   </body>
</html>
